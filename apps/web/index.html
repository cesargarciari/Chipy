<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/chipy-logo-320.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110e0c" />
    <meta
      name="description"
      content="Chipy: build an NBA prospect and steer a full career, one decision at a time. Your calls, your legacy."
    />
    <script>
      // Apply a saved light or dark choice before first paint, so the page never flashes.
      try {
        var saved = JSON.parse(localStorage.getItem('chipy.theme') || 'null');
        var theme = saved && saved.state && saved.state.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..500&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&display=swap"
      rel="stylesheet"
    />
    <title>Chipy: NBA Career Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
