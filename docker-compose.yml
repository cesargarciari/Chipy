name: chipy

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-inMemory']
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:4.6.1
    ports:
      - '8001:8001'
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      DYNAMODB_TABLE: chipy
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '5173:80'
    depends_on:
      - api
